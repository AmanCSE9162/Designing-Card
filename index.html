<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Card Design</title>
    <style>
        *{
            margin:0;
            padding:0;
        }
        body{
            background-color: gray;
            padding: 165px;
        }
        .card{
            background-color: white;
            width: 198px;
            border-radius: 7px;
            padding: 0 0 34px;

              
        }
        .image{
            padding:5px;
        }
        .image img{
            border-radius: 7px;
        }
        .content{
            padding: 7px 13px;
            font:poppins;
        }
        .content p{
            font-size: 13px;
            padding: 5px;
            color: gray;
        }
        .capsules{
            padding: 0 28px 0 14px;
        }
        .capsules span{
            border: 1px solid gray;
            padding: 0px 6px;
            border-radius: 7px;
            font-size: 10px;
            font-family:'Times New Roman', Times, serif;
        }
        .button{
            text-align: center;
        }
        .button button{
            padding: 7px 9px;
            border-radius: 15px;
            background-color: rgb(190, 190, 216);
            color: blue;
            font-size: 10px;
            margin-top: 7px;
            border: none;
            
        }
        .button button:hover{
            background-color: rgb(148, 148, 164);
            color: blue;

        }
    </style>

    

</head>
<body>
    <div class="card">
        <div class="image">
            <img width="188px" src="https://www.bing.com/th/id/OIP._JAf5XhRcS7dj29n8QQ7zQHaE7?w=193&h=135&c=8&rs=1&qlt=90&o=6&dpr=1.4&pid=ImgAns&rm=2" alt="">
        </div>

        <div class="capsules">
            <span>Nature</span>
            <span>Lake</span>

        </div>
        <div class="content">
            <h2>LIO</h2>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Quisquam, quod. Lorem ipsum dolor sit amet consectetur, adipisicing elit. Quasi accusantium esse in impedit, dolor modi asperiores possimus rem vero deleniti dignissimos velit quam?

            </p>
        </div>
        <div class="button">
            <button>Read More</button>
        

    </div>
    
</body>
</html>
